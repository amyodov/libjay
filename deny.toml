# cargo-deny configuration. Two lines of defense: the RustSec advisory
# database (catches yanked/malicious versions like RUSTSEC-2026-0260), and
# explicit bans of versions known to be poisoned, so the build fails even
# if the advisory feed lags.

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "allow"
deny = [
    # 2026-08-20 supply-chain attack: build-script malware via a
    # typosquatted dependency. RUSTSEC-2026-0260.
    { crate = "arrayref@0.3.10", reason = "malicious build-time payload" },
    { crate = "internment@0.8.7", reason = "malicious build-time payload" },
    { crate = "append-only-vec@0.1.9", reason = "malicious build-time payload" },
    { crate = "proc-macro1", reason = "typosquat of proc-macro2; the attack's carrier" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "BSL-1.0", "CDLA-Permissive-2.0", "CC0-1.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
