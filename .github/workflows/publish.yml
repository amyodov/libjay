# Publishing is never automatic: this runs only when a GitHub release is
# published, which is a manual act of the maintainer. The trust chain is
# PyPI's trusted publisher for amyodov/libjay, which accepts uploads only
# from this workflow file running in the `pypi` environment — OIDC, no token
# stored anywhere.
#
# Unlike a pure-Python project, one release is a matrix of native wheels:
# abi3-py310, one wheel per platform, users never invoke rustc. The sdist is
# the fallback for platforms outside the matrix; it builds with Cranelift
# alone unless the builder supplies LLVM (docs/testing.md).
#
# The wheel and C bundle jobs fetch a static LLVM that llvm-build.yml
# published and .github/llvm/SHA256SUMS pins; that workflow runs first,
# once per LLVM version.
name: Publish

on:
  release:
    types: [published]
  # Dry run: builds every wheel and the sdist, publishes nothing.
  workflow_dispatch:
  # Same dry run, weekly, so the wheel matrix doesn't rot in the gap between
  # releases (a runner image update, a toolchain drift). Publishes nothing:
  # the publish/crates jobs below are gated on the release event, which a
  # schedule never is.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  # Every wheel and C bundle links LLVM 21 statically (the `llvm` feature
  # beside the default Cranelift), from the archives llvm-build.yml
  # published and .github/llvm/SHA256SUMS pins. Each target builds on its
  # own architecture: llvm-sys runs the target's llvm-config at build time,
  # which a cross build could not.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64
            triple: aarch64-unknown-linux-gnu
          - os: macos-15-intel # GitHub's last Intel image
            target: x86_64
            triple: x86_64-apple-darwin
            macos: "10.12"
          - os: macos-15 # Apple Silicon
            target: aarch64
            triple: aarch64-apple-darwin
            macos: "11.0"
          - os: windows-latest
            target: x64
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Inside the workspace, because the manylinux container mounts only
      # that, at the same path.
      - name: Fetch static LLVM
        shell: bash
        run: |
          prefix=$(bash .github/llvm/fetch.sh ${{ matrix.triple }} .llvm)
          echo "LLVM_SYS_211_PREFIX=$prefix" >> "$GITHUB_ENV"
      # The deployment target LLVM was built for, so the wheel's tag and the
      # objects inside it agree.
      - if: matrix.macos
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos }}" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features llvm
          manylinux: "2014"
          docker-options: -e LLVM_SYS_211_PREFIX
          # The same compiler as everything else, named rather than left to
          # the action's default: a wheel built on a different one is not the
          # artifact CI vouched for. Matches rust-toolchain.toml.
          rust-toolchain: "1.89"
      # Cold-import the wheel just built and hold its LLVM to the
      # interpreter. Every target builds natively, so every wheel runs here.
      - name: Smoke test and LLVM check
        shell: bash
        run: |
          ls -l dist
          python .github/llvm/check_wheel.py --contents dist/*.whl
          python -m pip install dist/*.whl
          python -c "import jay; assert jay.j('(+/ % #) 1 2 3 4') == 2.5"
          libjay -e "echo 'wheel ok'"
          python .github/llvm/check_wheel.py
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  # The C ABI has no registry; its bundles ship as GitHub release assets.
  # linux-aarch64 C users build from source.
  capi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            libs: libjay.so libjay.a
          - os: macos-15
            triple: aarch64-apple-darwin
            libs: libjay.dylib libjay.a
            macos: "11.0"
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            libs: libjay.dylib libjay.a
            macos: "10.12"
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            libs: jay.dll jay.lib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
          targets: ${{ matrix.triple }}
      - name: Fetch static LLVM
        shell: bash
        run: |
          prefix=$(bash .github/llvm/fetch.sh ${{ matrix.triple }} "$RUNNER_TEMP/llvm")
          echo "LLVM_SYS_211_PREFIX=$prefix" >> "$GITHUB_ENV"
      - if: matrix.macos
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos }}" >> "$GITHUB_ENV"
      - run: cargo build --release -p libjay-capi --features llvm --target ${{ matrix.triple }}
      # LLVM is inside each library (its pass names are, which nothing else
      # in libjay carries), and the shared one does not load it from outside.
      - name: LLVM check
        shell: bash
        run: |
          cd "target/${{ matrix.triple }}/release"
          for f in ${{ matrix.libs }}; do
            grep -a -q loop-vectorize "$f" || { echo "no LLVM in $f" >&2; exit 1; }
            echo "$f: $(wc -c < "$f") bytes, LLVM inside"
          done
          case "${{ runner.os }}" in
            Linux) deps=$(readelf -d libjay.so | grep NEEDED) ;;
            macOS) deps=$(otool -L libjay.dylib) ;;
            *) deps= ;;
          esac
          echo "$deps"
          if echo "$deps" | grep -qi llvm; then
            echo "the shared library loads LLVM from outside" >&2
            exit 1
          fi
      - name: Bundle
        shell: bash
        run: |
          mkdir -p bundle
          cp crates/libjay-capi/include/jay.h LICENSE LICENSE-LLVM bundle/
          for f in ${{ matrix.libs }}; do
            cp "target/${{ matrix.triple }}/release/$f" bundle/
          done
          cd bundle && tar czf "../libjay-capi-${{ matrix.triple }}.tar.gz" *
          ls -l ../libjay-capi-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: capi-${{ matrix.triple }}
          path: libjay-capi-*.tar.gz

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    if: github.event_name == 'release'
    needs: [wheels, capi, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write # attach assets to the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      # Everything also lands on the release page: wheels and sdist for the
      # record, the C bundles as their only distribution channel.
      - name: Attach assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Keep only Python artifacts for PyPI
        run: rm -f dist/libjay-capi-*.tar.gz
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Wait for PyPI to serve this version
        run: |
          want="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 30); do
            got=$(curl -sS https://pypi.org/pypi/libjay/json |
                  python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" || true)
            [ "$got" = "$want" ] && exit 0
            sleep 10
          done
          echo "PyPI still serving $got, expected $want" >&2
          exit 1

      # The real user path, cold: the uvx one-liner the README promises.
      - name: Cold-run uvx
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ~/.local/bin/uvx --refresh libjay -e "(+/ % #) 1 2 3 4" | grep -qx "2.5"

  # The Rust crate ships with the same release, once the crate exists on
  # crates.io with trusted publishing configured. Dormant until the repo
  # variable CRATES_PUBLISH is set to "true": crates.io can only be given a
  # trusted publisher for an EXISTING crate, so the very first publish is a
  # manual `cargo publish -p libjay` by the owner.
  crates:
    if: github.event_name == 'release' && vars.CRATES_PUBLISH == 'true'
    needs: [publish]
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p libjay
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
