# Publishing is never automatic: this runs only when a GitHub release is
# published, which is a manual act of the maintainer. The trust chain is
# PyPI's trusted publisher for amyodov/libjay, which accepts uploads only
# from this workflow file running in the `pypi` environment — OIDC, no token
# stored anywhere.
#
# Unlike a pure-Python project, one release is a matrix of native wheels:
# abi3-py310, one wheel per platform, users never invoke rustc. The sdist is
# the fallback for platforms outside the matrix.
name: Publish

on:
  release:
    types: [published]
  # Dry run: builds every wheel and the sdist, publishes nothing.
  workflow_dispatch:
  # Same dry run, weekly, so the wheel matrix doesn't rot in the gap between
  # releases (a runner image update, a toolchain drift). Publishes nothing:
  # the publish/crates jobs below are gated on the release event, which a
  # schedule never is.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            smoke: true
          - os: ubuntu-latest
            target: aarch64 # cross-compiled; cannot run here
            smoke: false
          - os: macos-14 # Intel wheel, cross-compiled from the arm runner
            target: x86_64 # (GitHub's Intel macOS runners are being retired)
            smoke: false
          - os: macos-14 # Apple Silicon
            target: aarch64
            smoke: true
          - os: windows-latest
            target: x64
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      # Cold-import the wheel we just built (native targets only).
      - if: matrix.smoke
        shell: bash
        run: |
          pip install dist/*.whl
          python -c "import jay; assert jay.j('(+/ % #) 1 2 3 4') == 2.5"
          libjay -e "echo 'wheel ok'"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  # The C ABI has no registry; its bundles ship as GitHub release assets.
  # Native targets only (plus the mac Intel cross, which Apple toolchains
  # handle natively); linux-aarch64 C users build from source.
  capi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            libs: libjay.so libjay.a
          - os: macos-14
            triple: aarch64-apple-darwin
            libs: libjay.dylib libjay.a
          - os: macos-14
            triple: x86_64-apple-darwin
            libs: libjay.dylib libjay.a
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            libs: jay.dll jay.lib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          targets: ${{ matrix.triple }}
      - run: cargo build --release -p libjay-capi --target ${{ matrix.triple }}
      - name: Bundle
        shell: bash
        run: |
          mkdir -p bundle
          cp crates/libjay-capi/include/jay.h bundle/
          for f in ${{ matrix.libs }}; do
            cp "target/${{ matrix.triple }}/release/$f" bundle/
          done
          cd bundle && tar czf "../libjay-capi-${{ matrix.triple }}.tar.gz" *
      - uses: actions/upload-artifact@v4
        with:
          name: capi-${{ matrix.triple }}
          path: libjay-capi-*.tar.gz

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    if: github.event_name == 'release'
    needs: [wheels, capi, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write # attach assets to the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      # Everything also lands on the release page: wheels and sdist for the
      # record, the C bundles as their only distribution channel.
      - name: Attach assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Keep only Python artifacts for PyPI
        run: rm -f dist/libjay-capi-*.tar.gz
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Wait for PyPI to serve this version
        run: |
          want="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 30); do
            got=$(curl -sS https://pypi.org/pypi/libjay/json |
                  python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" || true)
            [ "$got" = "$want" ] && exit 0
            sleep 10
          done
          echo "PyPI still serving $got, expected $want" >&2
          exit 1

      # The real user path, cold: the uvx one-liner the README promises.
      - name: Cold-run uvx
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ~/.local/bin/uvx --refresh libjay -e "(+/ % #) 1 2 3 4" | grep -qx "2.5"

  # The Rust crate ships with the same release, once the crate exists on
  # crates.io with trusted publishing configured. Dormant until the repo
  # variable CRATES_PUBLISH is set to "true": crates.io can only be given a
  # trusted publisher for an EXISTING crate, so the very first publish is a
  # manual `cargo publish -p libjay` by the owner.
  crates:
    if: github.event_name == 'release' && vars.CRATES_PUBLISH == 'true'
    needs: [publish]
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p libjay
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
