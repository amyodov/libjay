name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the local dev toolchain so clippy findings are reproducible;
      # the same version rust-toolchain.toml names.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p libjay
      # Which CPU feature levels this runner can actually compare. The
      # x86-64-v4 clone is built into every artifact, but only a machine with
      # AVX-512 runs it, and the equivalence battery above covers it only
      # there. The test says which kind of machine this was.
      - run: cargo test -p libjay --test simd the_levels_this_machine_can_compare -- --nocapture
      - run: cargo build -p libjay-capi && cargo test -p libjay-capi
      - run: cargo clippy -p libjay -p libjay-capi -p libjay-testkit -p libjay-devtools --all-targets -- -D warnings
      # Cheap packaging check: catches drift like a missing LICENSE or a
      # broken `exclude` before a release tries to publish for real.
      - run: cargo publish -p libjay --dry-run

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      # docs.rs builds with warnings denied; a broken intra-doc link fails
      # here instead of showing up as a broken page on docs.rs after publish.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p libjay --no-deps

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # Pinned to the local dev toolchain, the version rust-toolchain.toml names.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install '.[test]'
      - run: pytest python/tests -q
      # The sdist path (source-only install, no prebuilt wheel) was only
      # ever checked by hand; one matrix leg now builds and installs it.
      - if: matrix.python-version == '3.10'
        name: sdist build and install smoke
        run: |
          pip install uv
          uv build --sdist
          pip install dist/*.tar.gz
          python -c "import jay; assert jay.j('(+/ % #) 1 2 3 4') == 2.5"
