name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the local dev toolchain so clippy findings are reproducible.
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p libjay
      - run: cargo build -p libjay-capi && cargo test -p libjay-capi
      - run: cargo clippy -p libjay -p libjay-capi -p libjay-testkit -p libjay-devtools --all-targets -- -D warnings

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      # Pinned to the local dev toolchain so clippy findings are reproducible.
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install '.[test]'
      - run: pytest python/tests -q
