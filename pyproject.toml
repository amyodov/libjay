[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "libjay"
description = "Embedded J and APL: compile array-language expressions and run them in parallel"
readme = "README.md"
license = "MIT"
authors = [{ name = "Alex Myodov", email = "amyodov@gmail.com" }]
requires-python = ">=3.10"
# PyPI ranks search on the summary and these; "libjay" itself carries no
# searchable term, so the words someone might type live here.
keywords = [
    "j",
    "apl",
    "array-language",
    "array-programming",
    "vectorization",
    "dataframe",
    "polars",
    "arrow",
    "numpy",
    "time-series",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Programming Language :: Other",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "numpy>=1.23",
    "pyarrow>=14",
    "polars>=1.0",
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/amyodov/libjay"
Repository = "https://github.com/amyodov/libjay"
Issues = "https://github.com/amyodov/libjay/issues"

[project.scripts]
libjay = "jay._cli:main"

[tool.maturin]
manifest-path = "crates/libjay-python/Cargo.toml"
module-name = "jay._jay"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
