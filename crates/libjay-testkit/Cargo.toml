[package]
name = "libjay-testkit"
description = "Corpus and snapshot plumbing shared by libjay's differential tests and the corpus recorder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "libjay_testkit"

[dependencies]
# Without the default features, so that `cargo test -p libjay
# --no-default-features` builds the engine without a code generator: the
# features a dev-dependency asks for would otherwise switch them back on.
libjay = { path = "../libjay", default-features = false }
