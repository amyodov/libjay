[package]
name = "libjay-python"
description = "Python binding for libjay"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_jay"
crate-type = ["cdylib"]

[features]
# LLVM as the optimising code generator beside Cranelift. Off here, so that
# a build from source needs no LLVM; the published wheels turn it on
# (`maturin build --features llvm`, .github/workflows/publish.yml).
llvm = ["libjay/llvm"]

[dependencies]
arrow-array = { version = "60.2.0", default-features = false, features = ["ffi"] }
arrow-buffer = "60.2.0"
arrow-data = "60.2.0"
arrow-schema = "60.2.0"
libjay = { path = "../libjay" }
pyo3 = { version = "0.30", features = ["abi3-py310"] }
