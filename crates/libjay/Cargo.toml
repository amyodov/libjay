[package]
name = "libjay"
description = "Independent, modern implementations of the J and APL array languages: parallel and vectorized, embeddable from Rust, Python, and C"
readme = "README.md"
keywords = ["j", "apl", "array", "vectorization", "language"]
categories = ["compilers", "mathematics", "science"]
# The differential suite is developed against the repository, not the
# published crate: its corpora and recorded snapshots are several thousand
# expressions of test data, and the recorder that refreshes them lives in a
# workspace crate that is not published at all.
exclude = ["tests/"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "jay"

[dependencies]
# Native code for the scalar step of a fold (src/jit/). Two code
# generators, each behind a feature; with neither, the interpreter runs
# every step. Cranelift is pure Rust and builds into the one artifact like
# everything else: no system compiler, no LLVM. 0.127 is the last line whose
# rust-version is the pinned 1.89.
cranelift-codegen = { version = "0.138.0", default-features = false, features = ["std", "host-arch"], optional = true }
cranelift-frontend = { version = "0.138.0", optional = true }
cranelift-jit = { version = "0.137.3", optional = true }
cranelift-module = { version = "0.137.3", optional = true }
cranelift-native = { version = "0.137.3", optional = true }
# LLVM 21 through its C API, the optimising tier. It needs an LLVM
# installation at build time, found through `llvm-config` or
# LLVM_SYS_211_PREFIX (docs/testing.md). The installation's static libraries
# are linked where it has them, so the library carries LLVM inside it; an
# installation with only a shared library is linked dynamically.
llvm-sys = { version = "231.0.2", features = ["prefer-static"], optional = true }
multiversion = "0.9"
# Arbitrary-precision integers: the carrier for J's extended type and for
# the two halves of a rational. The rational itself is ours — see
# docs/decisions.md.
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
# Blocking on wgpu's futures: libjay's surface is synchronous, and the
# device calls are the only asynchronous thing behind it.
pollster = "1.0"
rayon = "1.12.0"
# The device backend. Always compiled in — one artifact per platform — and
# dormant when the machine offers no adapter. Only the native backends and
# the WGSL front end are wanted; shaders are generated and compiled at run
# time, so nothing here runs at build time.
wgpu = { version = "30", default-features = false, features = [
    "std",
    "wgsl",
    "metal",
    "vulkan",
    "dx12",
] }

[features]
default = ["cranelift"]
# The fold step compiled with Cranelift.
cranelift = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
]
# The fold step compiled with LLVM; needs LLVM 21 at build time.
llvm = ["dep:llvm-sys"]

[dev-dependencies]
# Validating generated WGSL without an adapter: the f64 path cannot be run
# on a Metal machine, but it can be parsed and type-checked here.
naga = { version = "30", features = ["wgsl-in"] }
# The corpus/snapshot plumbing the differential suites replay, shared with
# the `jay-corpus` recorder in libjay-devtools.
libjay-testkit = { path = "../libjay-testkit" }
rstest = "0.29"
