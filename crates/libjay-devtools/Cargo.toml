[package]
name = "libjay-devtools"
description = "Developer tools for libjay: the corpus recorder that runs the reference interpreters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "jay-corpus"
path = "src/main.rs"

[dependencies]
libjay = { path = "../libjay" }
libjay-testkit = { path = "../libjay-testkit" }
rayon = "1.12.0"

# `kill(2)` on a process group, so that killing an oracle that outstays its
# limit kills whatever that oracle started.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
